server:
  port: 8080

spring:
  profiles:
    active: local
    group:
      local:
        - common
      prod:
        - common
config:
  import: optional:file:.env
---
spring:
  config:
    activate:
      on-profile: common

---
spring:
  config:
    activate:
      on-profile: local

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/proteinfriends_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: create   # \uCD5C\uCD08 \uAC1C\uBC1C \uB2E8\uACC4\uC5D0\uB9CC update \uAD8C\uC7A5 \u2192 \uC0DD\uC131 \uD6C4 validate\uB85C \uBCC0\uACBD
    properties:
      hibernate:
        show_sql: true
        format_sql: true
  jwt:
    secret: vmfhaltmskdlstkfkdgodyroqkfwkdbalroqkfwkdbalaaaaaaaaaaaaaaaabbbbbPLAINTEXT

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_SECRET_ID}
            redirect-uri: "http://localhost:8080/login/oauth2/code/google"
            scope:
              - email
              - profile
              - openid
              - https://www.googleapis.com/auth/userinfo.email
              - https://www.googleapis.com/auth/userinfo.profile
              - https://www.googleapis.com/auth/drive.readonly

          naver:
            client-id: ${NAVER_CLIENT_ID}
            client-secret: ${NAVER_SECRET_ID}
            redirect-uri: "http://localhost:8080/login/oauth2/code/naver"
            authorization-grant-type: authorization_code
            client-name: Naver
            scope: name, email

          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_SECRET_ID}
            redirect-uri: "http://localhost:8080/login/oauth2/code/kakao"
            client-name: Kakao
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post  # ✅ 꼭 필요
            scope:
              - profile_nickname
              - account_email

        provider:
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response

          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

    logging:
      level:
        org.springframework.security: DEBUG
        com.my.jwt: DEBUG
app:
  allowed-origins: ${ALLOWED_ORIGINS:http://localhost:3000}

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${RDS_ENDPOINT:my-prod-database}:3306/myapp?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: create # \uC6B4\uC601\uC740 validate \uACE0\uC815
    properties:
      hibernate:
        show_sql: false
  jwt:
    secret: vmfhaltmskdlstkfkdgodyroqkfwkdbalroqkfwkdbalaaaaaaaaaaaaaaaabbbbbPLAINTEXT

    security:
      oauth2:
        client:
          registration:
            google:
              client-id: ${GOOGLE_CLIENT_ID}
              client-secret: ${GOOGLE_SECRET_ID}
              redirect-uri: "http://localhost:8080/login/oauth2/code/google"
              scope: profile, email

            naver:
              client-id: ${NAVER_CLIENT_ID}
              client-secret: ${NAVER_SECRET_ID}
              redirect-uri: "http://localhost:8080/login/oauth2/code/naver"
              authorization-grant-type: authorization_code
              client-name: Naver
              scope: name, email

            kakao:
              client-id: ${KAKAO_CLIENT_ID}
              client-secret: ${KAKAO_SECRET_ID}
              redirect-uri: "http://localhost:8080/login/oauth2/code/kakao"
              client-name: Kakao
              authorization-grant-type: authorization_code
              client-authentication-method: client_secret_post  # ✅ 꼭 필요
              scope:
                - profile_nickname
                - account_email

          provider:
            naver:
              authorization-uri: https://nid.naver.com/oauth2.0/authorize
              token-uri: https://nid.naver.com/oauth2.0/token
              user-info-uri: https://openapi.naver.com/v1/nid/me
              user-name-attribute: response

            kakao:
              authorization-uri: https://kauth.kakao.com/oauth/authorize
              token-uri: https://kauth.kakao.com/oauth/token
              user-info-uri: https://kapi.kakao.com/v2/user/me
              user-name-attribute: id

    logging:
      level:
        org.springframework.security: DEBUG
        com.my.jwt: DEBUG
app:
  allowed-origins: ${ALLOWED_ORIGINS:https://YOUR_DOMAIN}