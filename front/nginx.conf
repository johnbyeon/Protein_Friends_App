###############################################
# 2️⃣ 프론트엔드 (www.proteinfriends.shop, proteinfriends.shop)
###############################################
server {
  listen 443 ssl;
  server_name www.proteinfriends.shop proteinfriends.shop;

  ssl_certificate /etc/letsencrypt/live/www.proteinfriends.shop/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/www.proteinfriends.shop/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;

  root /usr/share/nginx/html;
  index index.html;

  # ✅ API 요청 → backend
  location ^~ /api/ {
    proxy_pass http://backend:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # ✅ OAuth2 로그인 요청도 backend로
  location ^~ /login {
    proxy_pass http://backend:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location ^~ /oauth2/ {
    proxy_pass http://backend:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # ✅ React SPA fallback
  location / {
    try_files $uri /index.html;
  }
}