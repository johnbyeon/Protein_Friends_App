###############################################
# 1️⃣ HTTP → HTTPS 리다이렉트 (모든 도메인 공통)
###############################################
server {
  listen 80;
  server_name www.proteinfriends.shop proteinfriends.shop api.proteinfriends.shop;

  # Let's Encrypt 인증용 (certbot)
  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  # 나머지 요청은 HTTPS로 리다이렉트
  location / {
    return 301 https://$host$request_uri;
  }
}


###############################################
# 2️⃣ 프론트엔드 (www.proteinfriends.shop, proteinfriends.shop)
###############################################
server {
  listen 443 ssl;
  server_name www.proteinfriends.shop proteinfriends.shop;

  ssl_certificate /etc/letsencrypt/live/www.proteinfriends.shop/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/www.proteinfriends.shop/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;

  root /usr/share/nginx/html;
  index index.html;

  # ✅ React SPA fallback
  location / {
    try_files $uri /index.html;
  }

  # ✅ API 요청 → backend 컨테이너로 프록시
  location /api/ {
    proxy_pass http://backend:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # ✅ 소셜 로그인 리디렉션 (OAuth2, /login, /oauth2)
  location /login/ {
    proxy_pass http://backend:8080;
    include /etc/nginx/proxy_params;
  }

  location /oauth2/ {
    proxy_pass http://backend:8080;
    include /etc/nginx/proxy_params;
  }
}


###############################################
# 3️⃣ 백엔드 (api.proteinfriends.shop)
###############################################
server {
  listen 443 ssl;
  server_name api.proteinfriends.shop;

  ssl_certificate /etc/letsencrypt/live/www.proteinfriends.shop/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/www.proteinfriends.shop/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;

  # ✅ 모든 요청을 backend 컨테이너로 프록시
  location / {
    proxy_pass http://backend:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
}