# HTTP 요청 → HTTPS로 리다이렉트
server {
  listen 80;
  server_name www.proteinfriends.shop proteinfriends.shop;

  # 인증서 발급용 경로
  location /.well-known/acme-challenge/ {
    root /usr/share/nginx/html;
  }

  # 나머지는 HTTPS로 리다이렉트
  location / {
    return 301 https://$host$request_uri;
  }
}

# HTTPS 설정
server {
  listen 443 ssl;
  server_name www.proteinfriends.shop proteinfriends.shop;

  ssl_certificate /etc/letsencrypt/live/www.proteinfriends.shop/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/www.proteinfriends.shop/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;

  root /usr/share/nginx/html;
  index index.html;

  # API → 백엔드
  location /api/ {
    proxy_pass http://backend:8080/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # SPA fallback
  location / {
    try_files $uri /index.html;
  }
}
