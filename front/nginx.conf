###############################################
# 프론트엔드 (www.proteinfriends.shop, proteinfriends.shop)
###############################################
server {
  listen 443 ssl;
  server_name www.proteinfriends.shop proteinfriends.shop;

  ssl_certificate /etc/letsencrypt/live/www.proteinfriends.shop/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/www.proteinfriends.shop/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;

  root /usr/share/nginx/html;
  index index.html;

  # ✅ API -> backend
  location ^~ /api/ {
    proxy_pass http://backend:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Authorization $http_authorization;  # JWT 전달
  }

  # ✅ OAuth2 시작/콜백 모두 backend로
  location ^~ /oauth2/ {
    proxy_pass http://backend:8080;   # ← 끝에 슬래시 절대 붙이지 말 것
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }
  location ^~ /login/oauth2/ {
    proxy_pass http://backend:8080;   # ← 콜백도 명시적으로
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }

  # ✅ 프론트 로그인 페이지는 프론트가 렌더링
  location = /login {
    try_files $uri /index.html;
  }

  # ✅ React SPA fallback
  location / {
    try_files $uri /index.html;
  }
}